<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OshiCamera">
<meta name="theme-color" content="#06060a">
<title>推しカメラ (prototype)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- キャラクター選択画面 -->
<div id="select-screen">
  <div class="select-card">
    <h1>推しカメラ</h1>
    <p>一緒に撮影する推しを選んでください</p>
    <div id="character-list"></div>
  </div>
</div>

<!-- スタート画面 -->
<div id="start-screen">
  <div class="start-card">
    <h1>準備OK</h1>
    <p>カメラと「向きの検知(ジャイロ)」への<br>アクセスを許可してください。</p>
    <button id="start-btn">はじめる</button>
    <p class="start-note" id="start-error"></p>
  </div>
</div>

<!-- 撮影ステージ -->
<div id="stage-wrap">
  <div id="stage">
    <video id="camera-video" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
  </div>
</div>
<div id="flash-overlay"></div>
<div id="countdown-overlay"><span id="countdown-num"></span></div>

<!-- 初回設置ステップ -->
<div id="placement-intro">
  <div id="placement-intro-text">円をドラッグして立つ位置を決めてください<br>決まったら「ここに配置」を押してください</div>
</div>
<button id="placement-confirm-btn">ここに配置</button>

<!-- 操作UI -->
<div id="ui-layer">
  <div id="top-controls">
    <div id="top-bar">
      <!-- 常時見えるのはこの1個だけ。他は全てここから展開する -->
      <div class="top-bar-right">
        <button id="dock-toggle" aria-label="メニュー">⋯</button>
      </div>
    </div>
  </div>

  <!-- 折りたたみドック：タップで展開。既存の全機能ボタンをここに集約する -->
  <div id="top-dock">
    <div id="framing-bar"></div>
    <div class="dock-row">
      <button id="switch-cam-btn" class="icon-btn" title="カメラ切替">⟳</button>
      <button id="reticle-btn" class="icon-btn" title="配置/再配置">◎</button>
      <button id="shadow-adjust-btn" class="icon-btn" title="影の向き・長さ調整">◐</button>
      <button id="timer-btn" class="icon-btn" title="セルフタイマー">⏱</button>
    </div>
    <div class="dock-row">
      <button id="mode-btn" class="mode-chip" title="写真/動画 切替">写真</button>
      <button id="reset-btn" class="icon-btn" title="位置と向きの基準をリセット">⟲</button>
    </div>
  </div>

  <div id="bottom-controls">
    <!-- ポーズ/表情：カプセル1つに統合。矢印タップ、またはカプセルを
         左右にスワイプして切り替える(js/pose-ring.js、同一の公開APIを維持) -->
    <div id="ring-label"></div>
    <div id="ring-svg">
      <button id="cat-chip"><span id="cat-label">ポーズ</span></button>
      <button class="dock-arrow" id="dock-prev" aria-label="前へ">‹</button>
      <div class="dock-current" id="dock-current">
        <span class="dock-emoji" id="dock-emoji">🧍</span>
      </div>
      <button class="dock-arrow" id="dock-next" aria-label="次へ">›</button>
    </div>

    <div id="bottom-bar">
      <div id="shutter-status"></div>
      <div id="capture-row">
        <button id="shutter-btn" aria-label="撮影"></button>
      </div>
    </div>
  </div>
</div>

<!-- 撮影結果プレビュー -->
<div id="result-screen">
  <div id="result-imgwrap">
    <img id="result-img" alt="撮影結果">
    <video id="result-video" playsinline controls loop></video>
  </div>
  <p class="result-hint" id="result-hint">下にスワイプ、または「もう一度撮る」で撮り直せます</p>
  <div id="result-actions">
    <button id="share-btn">保存・共有する</button>
    <button id="retake-btn">もう一度撮る</button>
  </div>
</div>

<!-- 影の向き・長さ 手動調整パネル -->
<div id="shadow-panel">
  <div class="shadow-panel-handle"></div>
  <div class="pose-panel-head">
    <span>影の向き・長さ</span>
    <button id="shadow-panel-close" class="icon-btn small">✕</button>
  </div>
  <div class="pose-panel-row">
    <label>調整</label>
    <button id="shadow-manual-toggle" class="shadow-toggle-btn">オフ(自動)</button>
  </div>
  <div class="pose-panel-row slider-row">
    <label>向き</label>
    <input type="range" id="shadow-azimuth-slider" min="-180" max="180" step="1" value="0" disabled>
    <span id="shadow-azimuth-val">0°</span>
  </div>
  <div class="pose-panel-row slider-row">
    <label>長さ</label>
    <input type="range" id="shadow-length-slider" min="0" max="100" step="1" value="50" disabled>
    <span id="shadow-length-val">50</span>
  </div>
  <div class="pose-panel-actions">
    <button id="shadow-reset-btn">自動に戻す</button>
  </div>
  <p class="pose-panel-hint">通常は環境認識による自動調整です。撮影時に影の向き・長さが不自然な場合のみ、上の「調整」をオンにして手動で直してください。</p>
</div>

<div id="pose-toast"></div>

<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div id="loading-text">推しを読み込み中…</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script src="js/pose-ring.js"></script>
<script src="js/ui-gestures.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
